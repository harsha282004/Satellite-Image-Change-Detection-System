# Phase 14.3, hyperparameter experiment: identical to configs/siamese_attention_e100.yaml except
# the initial learning rate (2e-4, double the lr=1e-4 baseline).
extends: config.yaml

experiment_name: siamese_unet_diff_concat_attention_lr2e-4

model:
  type: siamese_unet
  base_channels: 32
  comparison_mode: diff_concat
  use_attention: true

dataset:
  root: data/raw/levir_cd
  image_size: 256

dataloader:
  batch_size: 8
  num_workers: 0

training:
  epochs: 100
  learning_rate: 0.0002
  optimizer: adam
  weight_decay: 0.0
  loss: bce_dice
  seed: 42
  early_stopping:
    enabled: true
    monitor: val_iou
    patience: 10
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 4
    min_lr: 1.0e-6
