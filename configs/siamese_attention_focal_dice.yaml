# Phase 14, loss experiment: identical to configs/siamese_attention_e100.yaml (Phase 13's
# scientifically justified best training strategy: max 100 epochs, early stopping patience=10,
# ReduceLROnPlateau) except the loss function. Isolates the effect of Focal+Dice vs. BCE+Dice
# (the configs/siamese_attention_e100.yaml result is reused as the BCE+Dice entry — not retrained).
extends: config.yaml

experiment_name: siamese_unet_diff_concat_attention_focal_dice

model:
  type: siamese_unet
  base_channels: 32
  comparison_mode: diff_concat
  use_attention: true

dataset:
  root: data/raw/levir_cd
  image_size: 256

dataloader:
  batch_size: 8
  num_workers: 0

training:
  epochs: 100
  learning_rate: 0.0001
  optimizer: adam
  weight_decay: 0.0
  loss: focal_dice
  loss_params:
    focal_alpha: 0.8
    focal_gamma: 2.0
    focal_weight: 0.5
    dice_weight: 0.5
  seed: 42
  early_stopping:
    enabled: true
    monitor: val_iou
    patience: 10
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 4
    min_lr: 1.0e-6
