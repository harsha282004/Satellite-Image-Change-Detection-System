# Phase 13, Experiment B: same architecture/data/optimizer/seed as configs/siamese_attention.yaml
# (Experiment A, the preserved 30-epoch baseline), but with a larger max-epoch budget, early
# stopping, and a ReduceLROnPlateau scheduler, to test whether the fixed 30-epoch budget was
# undertraining the model. Distinct experiment_name so Experiment A's checkpoint/history are
# never touched (see DEVELOPMENT_LOG.md Phase 6's checkpoint-overwrite incident/lesson).
extends: config.yaml

experiment_name: siamese_unet_diff_concat_attention_e60

model:
  type: siamese_unet
  base_channels: 32
  comparison_mode: diff_concat
  use_attention: true

dataset:
  root: data/raw/levir_cd
  image_size: 256

dataloader:
  batch_size: 8
  num_workers: 0

training:
  epochs: 60  # maximum budget — early stopping may end training sooner
  learning_rate: 0.0001
  optimizer: adam
  weight_decay: 0.0
  loss: bce_dice
  seed: 42
  early_stopping:
    enabled: true
    monitor: val_iou
    patience: 10
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 4
    min_lr: 1.0e-6
