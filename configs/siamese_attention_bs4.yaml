# Phase 14.3, hyperparameter experiment: identical to configs/siamese_attention_e100.yaml except
# batch_size=4 (half the baseline's 8). Chosen over a larger batch size (e.g. 16) for VRAM safety
# margin — this machine's GPU is sometimes shared with other local processes (Phase 1 observed
# ~2.5GB used by an unrelated process), and a smaller batch is a safe, still-informative single
# data point (more gradient steps per epoch, noisier gradient estimates) without risking an OOM
# mid-run. Per the "not an unnecessarily huge grid search" instruction, only one batch-size
# variant is tested.
extends: config.yaml

experiment_name: siamese_unet_diff_concat_attention_bs4

model:
  type: siamese_unet
  base_channels: 32
  comparison_mode: diff_concat
  use_attention: true

dataset:
  root: data/raw/levir_cd
  image_size: 256

dataloader:
  batch_size: 4
  num_workers: 0

training:
  epochs: 100
  learning_rate: 0.0001
  optimizer: adam
  weight_decay: 0.0
  loss: bce_dice
  seed: 42
  early_stopping:
    enabled: true
    monitor: val_iou
    patience: 10
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 4
    min_lr: 1.0e-6
